name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"


      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build all targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/binaural-beats/
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./cmd/binaural-beats/
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/binaural-beats/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/converter/

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean --skip=validate --id=binaural-beats --id=converter

  # Compiles the Tauri desktop app, including tauri-build's checks of the
  # bundled engine (externalBin).
  tauri-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install Tauri dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "tauri-app/src-tauri -> target"

      - name: Build Go engine sidecar
        run: ./scripts/build-sidecar.sh

      - name: Check formatting
        working-directory: tauri-app/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: tauri-app/src-tauri
        run: cargo clippy --all-targets -- -D warnings
