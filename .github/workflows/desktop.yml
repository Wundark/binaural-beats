name: Desktop App

# Builds the Tauri desktop app installers. Tags build every platform and
# attach the installers to the GitHub Release; pull requests build Linux only.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}]' || '[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"macos-latest","target":"x86_64-apple-darwin"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "tauri-app/src-tauri -> target"
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install Tauri dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build Go engine sidecar
        shell: bash
        run: ./scripts/build-sidecar.sh ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Build installers
        working-directory: tauri-app
        run: npx tauri build --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          # Versions below 1.0.0 are test releases.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
