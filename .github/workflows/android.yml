name: Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Tauri CLI
        id: cache-tauri
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tauri-cli-${{ runner.os }}-${{ hashFiles('tauri-app/src-tauri/Cargo.toml') }}
          restore-keys: |
            tauri-cli-${{ runner.os }}-

      - name: Install Tauri CLI
        if: steps.cache-tauri.outputs.cache-hit != 'true'
        run: cargo install tauri-cli

      - name: Build Go shared libraries for Android
        run: ./scripts/build-android-lib.sh

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm install

      - name: Build Android APK
        working-directory: tauri-app
        run: cargo tauri android build --apk
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tauri-app/src-tauri/gen/android/app/build/outputs/apk/release/*.apk
            tauri-app/src-tauri/gen/android/app/build/outputs/apk/debug/*.apk
