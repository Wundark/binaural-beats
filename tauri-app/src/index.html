<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binaural Beats</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Binaural Beats</h1>
      <p class="subtitle">Brainwave Entrainment Generator</p>
    </header>

    <section class="config-section">
      <h2>Session</h2>
      <div class="session-info">
        <div class="session-header">
          <span id="config-name" class="config-name">No session loaded</span>
          <span id="session-duration" class="session-duration"></span>
        </div>
        <p id="session-description" class="session-description">Pick a session from the library or open a YAML or SBaGen (.sbg) file.</p>
      </div>
      <div id="preset-list" class="preset-list"></div>
      <div class="config-controls">
        <button id="btn-load" class="btn btn-secondary">Open File&hellip;</button>
      </div>
    </section>

    <section class="stretch-section">
      <h2>Time Stretch</h2>
      <div class="stretch-controls">
        <input type="range" id="stretch-slider" min="0.5" max="3.0" step="0.1" value="1.0" />
        <span id="stretch-value">1.0x</span>
        <button id="btn-stretch" class="btn btn-secondary">Apply</button>
      </div>
    </section>

    <section class="playback-section">
      <h2>Playback</h2>
      <div class="playback-controls">
        <button id="btn-play" class="btn btn-play" disabled>Play</button>
        <button id="btn-stop" class="btn btn-stop" disabled>Stop</button>
        <button id="btn-export" class="btn btn-secondary" disabled>Export WAV</button>
      </div>

      <div class="volume-controls">
        <label for="volume-slider">Volume</label>
        <input type="range" id="volume-slider" min="0" max="100" step="1" value="100" />
        <span id="volume-value">100%</span>
      </div>

      <div class="progress-container">
        <div class="timeline-legend" aria-hidden="true">
          <span class="legend-beat">Beat frequency</span>
          <span class="legend-tone">Tone volume</span>
          <span class="legend-noise">Pink noise volume</span>
        </div>
        <canvas id="timeline" class="timeline"></canvas>
        <div class="progress-time">
          <span id="time-elapsed">0:00</span>
          <span id="timeline-hover" class="timeline-hover"></span>
          <span id="time-total">/ 0:00</span>
        </div>
      </div>
    </section>

    <section class="status-section">
      <h2>Status</h2>
      <div class="status-grid">
        <div class="status-item">
          <label>Base Frequency</label>
          <span id="status-freq" class="status-value">-- Hz</span>
        </div>
        <div class="status-item">
          <label>Beat Frequency</label>
          <span id="status-beat" class="status-value">-- Hz</span>
        </div>
        <div class="status-item">
          <label>Tone Volume</label>
          <span id="status-tone-vol" class="status-value">--%</span>
        </div>
        <div class="status-item">
          <label>Pink Noise Volume</label>
          <span id="status-pink-vol" class="status-value">--%</span>
        </div>
      </div>
    </section>

    <footer id="app-version" class="app-version"></footer>

    <div id="message-bar" class="message-bar hidden"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
